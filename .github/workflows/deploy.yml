name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar CSS (Tailwind)
        run: npm run build

      - name: Armar sitio solo con archivos publicos
        run: |
          rm -rf site
          mkdir -p site/dist
          cp index.html contacto.html equipo.html privacidad.html site/
          cp dist/app.css site/dist/
          cp .htaccess robots.txt sitemap.xml site/
          cp ./*.webp ./*.jpeg ./*.jpg ./*.png site/
          echo "Contenido a publicar:"
          find site -type f | sort

      - name: Publicar rama deploy
        run: |
          cd site
          git init -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy de ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
